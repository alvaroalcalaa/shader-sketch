<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Shader Sketch</title><link rel="stylesheet" href="styles.css"></head><body><main><section class="intro"><p class="tag">WEBGL / 001</p><h1>Shader<br><i>Sketch.</i></h1><p class="copy">A little studio for generative light, terrain and motion. Built from fragments.</p><div class="controls"><label>Scene<select id="scene"><option value="0">Aurora</option><option value="1">Topography</option><option value="2">Orbit</option></select></label><label>Palette<input id="palette" type="color" value="#b8ff6a"></label><label>Speed<input id="speed" type="range" min="0" max="2" step=".05" value=".55"></label><label>Density<input id="density" type="range" min=".2" max="2.5" step=".05" value="1.1"></label></div><div class="actions"><button id="pause">Pause</button><button id="export">Export PNG ↗</button></div><p class="note">No pixels were downloaded. Every frame is calculated locally.</p></section><section class="stage"><canvas id="gl"></canvas><div class="overlay"><span id="sceneName">AURORA</span><span>LIVE</span></div></section></main><script src="app.js"></script></body></html>
